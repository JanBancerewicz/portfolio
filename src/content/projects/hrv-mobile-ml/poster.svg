<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-label="HRV on a Phone">
  <defs>
    <filter id="mute" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1 0.04 0.04 0 0.05  0.04 1 0.04 0 0.05  0.04 0.04 0.62 0 0.05  0 0 0 1 0"/>
    </filter>
    
    <radialGradient id="accentTL" cx="0%" cy="0%" r="85%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a9a88" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#1a9a88" stop-opacity="0.50"/>
      <stop offset="70%" stop-color="#1a9a88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a9a88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentTR" cx="100%" cy="0%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a9a88" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#1a9a88" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a9a88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentBL" cx="0%" cy="100%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a9a88" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#1a9a88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a9a88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentBR" cx="100%" cy="100%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a9a88" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#1a9a88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1a9a88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="darkFrost" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#060a10" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0a121c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#05080c" stop-opacity="0.62"/>
    </linearGradient>
  </defs>
  <g transform="translate(-1308.0 0.0) scale(2.00000)">
    <g filter="url(#mute)">
    <defs>
      <linearGradient id="visbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#243a52"/><stop offset="100%" stop-color="#152636"/>
      </linearGradient>
      <radialGradient id="vislens">
        <stop offset="0%" stop-color="#e8f4ff"/><stop offset="35%" stop-color="#5a9ad0"/>
        <stop offset="70%" stop-color="#1e4a78"/><stop offset="100%" stop-color="#0a2030"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#visbg)"/>
    <ellipse cx="320" cy="200" rx="280" ry="180" fill="#0073ff" opacity="0.1"/>
    <ellipse cx="980" cy="560" rx="320" ry="220" fill="#22d3ee" opacity="0.08"/>
    <!-- Camera body -->
    <rect x="620" y="220" width="420" height="300" rx="36" fill="#2a4868" stroke="#9ec8e8" stroke-width="3" opacity="0.85"/>
    <rect x="650" y="250" width="120" height="36" rx="10" fill="#1a3048"/>
    <circle cx="860" cy="370" r="108" fill="#122030" stroke="#c8e4f8" stroke-width="4"/>
    <circle cx="860" cy="370" r="78" fill="url(#vislens)"/>
    <circle cx="860" cy="370" r="28" fill="#0a1828" opacity="0.7"/>
    <circle cx="830" cy="340" r="14" fill="#fff" opacity="0.35"/>
    <!-- Viewfinder / corner brackets (detection UI) -->
    <g fill="none" stroke="#7ec0ff" stroke-width="3" opacity="0.55">
      <path d="M180,160 L180,120 L240,120"/><path d="M400,120 L460,120 L460,160"/>
      <path d="M180,320 L180,360 L240,360"/><path d="M400,360 L460,360 L460,320"/>
    </g>
    <rect x="200" y="150" width="240" height="190" rx="8" fill="#0073ff" opacity="0.08" stroke="#7ec0ff" stroke-width="1.5"/>
    <circle cx="320" cy="245" r="6" fill="#22d3ee" opacity="0.8"/>
    <line x1="200" y1="200" x2="440" y2="200" stroke="#7ec0ff" stroke-width="1" opacity="0.25"/>
    <line x1="200" y1="290" x2="440" y2="290" stroke="#7ec0ff" stroke-width="1" opacity="0.25"/>
  </g>
  </g>
  <rect width="900" height="1600" fill="url(#darkFrost)"/>
  <rect width="900" height="1600" fill="url(#accentTL)"/>
  <rect width="900" height="1600" fill="url(#accentTR)"/>
  <rect width="900" height="1600" fill="url(#accentBL)"/>
  <rect width="900" height="1600" fill="url(#accentBR)"/>

  <foreignObject x="48" y="48" width="804" height="134">
  <div xmlns="http://www.w3.org/1999/xhtml"
       style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;width:100%;margin:0;padding:0;">
    <div style="display:inline-block;box-sizing:border-box;
      background:rgba(8,12,18,0.72);border-radius:999px;padding:13px 22px;
      font-family:'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;font-size:30px;font-weight:700;
      letter-spacing:0.12em;color:#f4f7fa;line-height:1.1;white-space:nowrap;">APPLIED ML</div>
    <div style="display:inline-block;box-sizing:border-box;
      background:rgba(8,12,18,0.72);border-radius:999px;padding:13px 22px;
      font-family:'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;font-size:30px;font-weight:700;
      letter-spacing:0.12em;color:#f4f7fa;line-height:1.1;white-space:nowrap;">PPG</div>
  </div>
</foreignObject>
</svg>
