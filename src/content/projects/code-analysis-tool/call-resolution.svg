<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="Diagram of Code ReViewer's call resolution: a call expression in source produces an ordered list of candidate unique names, which are looked up one by one in the map of every function definition seen across all files; the first hit becomes a graph edge, and a call whose candidates all miss is dropped without drawing anything.">
  <rect x="0" y="0" width="940" height="560" fill="#f7f5f0"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#15130f">

    <!-- column headings -->
    <text x="30" y="40" font-size="14" font-weight="700" letter-spacing="1.2">1 · CALL SITE</text>
    <text x="300" y="40" font-size="14" font-weight="700" letter-spacing="1.2">2 · CANDIDATES (ORDERED)</text>
    <text x="690" y="40" font-size="14" font-weight="700" letter-spacing="1.2">3 · LOOKUP</text>

    <!-- ============ resolved case ============ -->
    <rect x="30" y="62" width="238" height="86" rx="6" fill="#ffffff" stroke="#15130f" stroke-width="1.6"/>
    <text x="46" y="88" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">class Panel extends View {</text>
    <text x="46" y="108" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  this.repo.load();</text>
    <text x="46" y="128" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">}</text>

    <text x="30" y="170" font-size="12.5" fill="#4a463d">receiver this.repo is a field</text>
    <text x="30" y="188" font-size="12.5" fill="#4a463d">of declared type db.Repo</text>

    <path d="M272 105 H 296" stroke="#15130f" stroke-width="1.6" fill="none" marker-end="url(#ink)"/>

    <!-- candidate rows, resolved -->
    <rect x="300" y="62" width="326" height="34" rx="5" fill="#ffffff" stroke="#a8a294" stroke-width="1.3"/>
    <text x="314" y="84" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app.Panel.load</text>
    <text x="596" y="84" font-size="16" fill="#8a8577" text-anchor="middle">✕</text>

    <rect x="300" y="104" width="326" height="34" rx="5" fill="#ffffff" stroke="#a8a294" stroke-width="1.3"/>
    <text x="314" y="126" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app.View.load</text>
    <text x="596" y="126" font-size="16" fill="#8a8577" text-anchor="middle">✕</text>

    <rect x="300" y="146" width="326" height="34" rx="5" fill="#e9f2e4" stroke="#2f6b32" stroke-width="2"/>
    <text x="314" y="168" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f4a22">db.Repo.load</text>
    <text x="596" y="168" font-size="15" font-weight="700" fill="#2f6b32" text-anchor="middle">✓</text>

    <text x="300" y="202" font-size="12.5" fill="#4a463d">first match wins — later candidates are never tried</text>

    <path d="M630 163 H 682" stroke="#2f6b32" stroke-width="2" fill="none" marker-end="url(#green)"/>

    <!-- ============ the map ============ -->
    <rect x="686" y="62" width="224" height="196" rx="6" fill="#ffffff" stroke="#15130f" stroke-width="1.6"/>
    <text x="700" y="86" font-size="12.5" font-weight="700">allFunctions</text>
    <text x="700" y="104" font-size="11.5" fill="#4a463d">every definition seen, all files</text>
    <line x1="700" y1="114" x2="896" y2="114" stroke="#d8d3c6" stroke-width="1.2"/>
    <text x="700" y="136" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">app.Panel.render</text>
    <rect x="694" y="146" width="204" height="26" rx="4" fill="#e9f2e4"/>
    <text x="700" y="164" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f4a22">db.Repo.load</text>
    <text x="700" y="192" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">db.Repo.close</text>
    <text x="700" y="216" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">app.View.mount</text>
    <text x="700" y="240" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">…</text>

    <!-- outcome: edge -->
    <path d="M798 258 V 296" stroke="#2f6b32" stroke-width="2" fill="none" marker-end="url(#green)"/>
    <g transform="translate(686,308)">
      <rect x="0" y="0" width="224" height="76" rx="6" fill="#e9f2e4" stroke="#2f6b32" stroke-width="1.8"/>
      <circle cx="42" cy="32" r="9" fill="#2f6b32"/>
      <path d="M55 32 H 118" stroke="#2f6b32" stroke-width="2" marker-end="url(#green)"/>
      <circle cx="134" cy="32" r="9" fill="#2f6b32"/>
      <text x="42" y="62" font-size="11.5" fill="#1f4a22" text-anchor="middle">caller</text>
      <text x="134" y="62" font-size="11.5" fill="#1f4a22" text-anchor="middle">callee</text>
      <text x="160" y="30" font-size="12" font-weight="700" fill="#1f4a22">edge</text>
      <text x="160" y="45" font-size="12" font-weight="700" fill="#1f4a22">drawn</text>
    </g>

    <!-- divider -->
    <line x1="30" y1="412" x2="910" y2="412" stroke="#d8d3c6" stroke-width="1.4" stroke-dasharray="5 5"/>

    <!-- ============ dropped case ============ -->
    <rect x="30" y="436" width="238" height="60" rx="6" fill="#ffffff" stroke="#15130f" stroke-width="1.6"/>
    <text x="46" y="472" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  memcpy(dst, src, n);</text>
    <text x="30" y="518" font-size="12.5" fill="#4a463d">callee is defined outside the analysed set</text>

    <path d="M272 466 H 296" stroke="#15130f" stroke-width="1.6" fill="none" marker-end="url(#ink)"/>

    <rect x="300" y="449" width="326" height="34" rx="5" fill="#ffffff" stroke="#a8a294" stroke-width="1.3" stroke-dasharray="4 4"/>
    <text x="314" y="471" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4a463d">memcpy</text>
    <text x="596" y="471" font-size="16" fill="#8a8577" text-anchor="middle">✕</text>

    <path d="M630 466 H 682" stroke="#8a8577" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#grey)"/>

    <rect x="686" y="438" width="224" height="56" rx="6" fill="#efece4" stroke="#8a8577" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="798" y="463" font-size="13" font-weight="700" fill="#4a463d" text-anchor="middle">no edge, no node,</text>
    <text x="798" y="481" font-size="13" font-weight="700" fill="#4a463d" text-anchor="middle">no warning</text>

    <text x="30" y="546" font-size="12" fill="#6b6558">In j2k.c (13,180 lines): 1,616 call sites → 149 edges. The other 1,467 took the bottom path.</text>
  </g>

  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15130f"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b32"/>
    </marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8577"/>
    </marker>
  </defs>
</svg>
