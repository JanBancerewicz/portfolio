<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-label="Boat Vision">
  <defs>
    <filter id="mute" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1 0.04 0.04 0 0.05  0.04 1 0.04 0 0.05  0.04 0.04 0.62 0 0.05  0 0 0 1 0"/>
    </filter>
    
    <radialGradient id="accentTL" cx="0%" cy="0%" r="85%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f2cb05" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f2cb05" stop-opacity="0.50"/>
      <stop offset="70%" stop-color="#f2cb05" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f2cb05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentTR" cx="100%" cy="0%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f2cb05" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#f2cb05" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f2cb05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentBL" cx="0%" cy="100%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f2cb05" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#f2cb05" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f2cb05" stop-opacity="0"/>
