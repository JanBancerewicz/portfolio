  <head>
    <meta charset="UTF-8" />

    />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0b" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jan Bancerewicz — AI &amp; software developer" />

      property="og:description"
      content="Projects, hackathons, certificates and writing from an AI &amp; software developer working on LLM interpretability, computer vision and biosignal models."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the stored theme and marks JS as available before first paint,
      // so there is no flash of the wrong theme and no flash of the
      // pre-animation state of revealed elements.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        root.dataset.theme = theme;
        root.style.colorScheme = theme;

        // The "js" class is what hides elements before their reveal animation
        // runs. If the bundle never boots, drop it so the prerendered content
        // stays readable instead of leaving a blank page.
        window.setTimeout(function () {
          if (!root.hasAttribute("data-booted")) root.classList.remove("js");
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
